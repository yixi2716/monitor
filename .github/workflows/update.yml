name: update-pig-data

on:
  schedule:
    - cron: '30 8 * * *'        # 每日 UTC 08:30 = 北京 16:30（A股收盘后，猪数据）
    - cron: '0 6 * * *'         # 每日 UTC 06:00 = 北京 14:00（美股前一晚收盘后，黄金+铜）
    - cron: '0 1 10 * *'        # 每月10日 09:00 北京：月报/周报
    - cron: '0 1 15 * *'        # 每月15日 09:00 北京：能繁母猪
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pig-pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # 黄金+铜（UTC 06:00 定时 或 手动触发）
      - if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_gold.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_copper.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 医药（每日）
      - if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_pharma.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 猪（UTC 08:30 定时 或 手动触发）
      - if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_daily.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/signals.py

      # 月报/能繁
      - if: github.event.schedule == '0 1 10 * *'
        run: python scripts/fetch_reports.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 1 15 * *'
        run: python scripts/fetch_monthly.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 同步猪数据到 site/data
      - run: cp data/latest.json data/history.json data/signals.json data/sow_history.json data/manual.json site/data/ 2>/dev/null || true

      # 只 commit + push 一次，从根本上避免并行冲突
      - run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add data/ site/data/
          git commit -m "data: daily $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main
          git push

  deploy:
    if: always()
    needs: [fetch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
