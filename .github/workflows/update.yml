name: update-pig-data

on:
  schedule:
    - cron: '0 16 * * *'         # 每日 UTC 16:00 = 北京次日 00:00（当天 A股+美股数据均已收盘，统一更新全部品种 + AI 分析存档）
    - cron: '0 1 10 * *'        # 每月10日 09:00 北京：月报/周报
    - cron: '0 1 15 * *'        # 每月15日 09:00 北京：能繁母猪
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pig-pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # 黄金+铜+医药+猪（UTC 16:00 = 北京 0 点 定时 或 手动触发）
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_gold.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_copper.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 医药（每日）
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_pharma.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 猪（每日）
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_daily.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/signals.py

      # AI 每日综合分析（数据齐后统一生成，按日期存档；当天已有人工保存的存档则不覆盖）
      - if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/ai_daily.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 月报/能繁
      - if: github.event.schedule == '0 1 10 * *'
        run: python scripts/fetch_reports.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 1 15 * *'
        run: python scripts/fetch_monthly.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 同步猪数据到 site/data
      - run: cp data/latest.json data/history.json data/signals.json data/sow_history.json data/manual.json site/data/ 2>/dev/null || true

      # 只 commit + push 一次，从根本上避免并行冲突
      - run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add -f data/ site/data/
          git commit -m "data: daily $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main
          git push

  deploy:
    if: always()
    needs: [fetch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
