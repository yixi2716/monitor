name: update-pig-data

on:
  schedule:
    - cron: '0 10 * * *'         # 每日 UTC 10:00 = 北京 18:00（A股已收盘约3小时，Tushare日线已发布）
    - cron: '0 1 10 * *'        # 每月10日 09:00 北京：月报/周报
    - cron: '0 1 15 * *'        # 每月15日 09:00 北京：能繁母猪
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pig-pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # 黄金+铜+医药+猪（UTC 22:00 = 北京早 6 点 定时 或 手动触发）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_gold.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_copper.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 医药（每日）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_pharma.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 医药位置信号（灯⑥估值分位 + 灯⑦成交占比分位，akshare 免费源）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_valuation.py
        continue-on-error: true

      # BD 出海产业引擎（License-out 首付款 + NMPA 获批，新闻提取口径）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_bd.py
        continue-on-error: true

      # 光伏（每日，全 Tushare 路由，规避 akshare 国内源挂死）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_solar.py
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      # 猪（每日）
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_daily.py
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_pig_stocks.py
        continue-on-error: true
      - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        run: python scripts/signals.py

      # AI 每日自动分析已停用：曾因生成失败反复 rerun 消耗 API 额度。
      # 现改为页面手动"重新生成" + "存入档案"（见 site/ai_archive.js）。
      # 如需恢复，取消下面注释并确保配置了 DEEPSEEK_API_KEY secret：
      # - if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
      #   run: python scripts/ai_daily.py
      #   continue-on-error: true
      #   env:
      #     DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 月报/能繁
      - if: github.event.schedule == '0 1 10 * *'
        run: python scripts/fetch_reports.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - if: github.event.schedule == '0 1 15 * *'
        run: python scripts/fetch_monthly.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 同步猪数据到 site/data
      - run: cp data/latest.json data/history.json data/signals.json data/sow_history.json data/manual.json site/data/ 2>/dev/null || true

      # 只 commit + push 一次，从根本上避免并行冲突；push 被撞时重试一次
      - run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add -f data/ site/data/
          git commit -m "data: daily $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main && git push || \
            (echo "push 被拒（可能与其他提交撞车），10s 后重试"; sleep 10; \
             git pull --rebase origin main && git push)

  deploy:
    if: always()
    needs: [fetch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
