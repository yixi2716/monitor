name: update-pig-data

on:
  schedule:
    - cron: '30 8 * * *'        # 每日 UTC 08:30 = 北京 16:30（A股收盘后，猪数据）
    - cron: '0 6 * * *'         # 每日 UTC 06:00 = 北京 14:00（美股前一晚收盘后，黄金）
    - cron: '0 1 10 * *'        # 每月10日 09:00 北京：月报/周报
    - cron: '0 1 15 * *'        # 每月15日 09:00 北京：能繁母猪
  workflow_dispatch:
  push:
    branches: [main]            # 数据脚本每日提交后自动触发部署（daily job 会跳过）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pig-pages
  cancel-in-progress: true

jobs:
  daily:
    if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_daily.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: python scripts/signals.py
      - run: |
          cp data/latest.json data/history.json data/signals.json data/sow_history.json data/manual.json site/data/ 2>/dev/null || true
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add data/ site/data/
          git commit -m "data: pig daily $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main || git pull --rebase origin main
          git push

  gold_daily:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_gold.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add data/ site/data/gold/
          git commit -m "data: gold daily $(date -u +%Y-%m-%d)" || echo "no changes"
          git push

  monthly_sow:
    if: github.event.schedule == '0 1 15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_monthly.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - run: python scripts/signals.py

  monthly_reports:
    if: github.event.schedule == '0 1 10 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_reports.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  deploy:
    # push（daily 自动提交的数据）或任一数据 job 成功后部署 Pages
    if: always() && (github.event_name == 'push' || needs.daily.result == 'success' || needs.gold_daily.result == 'success' || needs.monthly_sow.result == 'success' || needs.monthly_reports.result == 'success')
    needs: [daily, gold_daily, monthly_sow, monthly_reports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy data into site
        run: |
          mkdir -p site/data
          cp data/*.json site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
