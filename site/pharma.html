<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医药板块监测台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<style>
:root{
  --bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#3fb950;--accent2:#58a6ff;--up:#3fb950;--down:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;padding:20px;max-width:1400px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:22px;display:flex;align-items:center;gap:8px}
.header a{color:var(--muted);text-decoration:none;font-size:13px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;border-top:3px solid var(--accent)}
.kpi .label{font-size:12px;color:var(--muted)}
.kpi .value{font-size:24px;font-weight:700;margin:4px 0}
.kpi .chg{font-size:13px}
.kpi .chg.up{color:var(--up)}.kpi .chg.down{color:var(--down)}
.kpi .src{font-size:10px;color:var(--muted);margin-top:6px}
.kpi .src a{color:var(--accent2);text-decoration:none}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.section h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.news-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.news-item:last-child{border:none}
.news-item .date{color:var(--muted);margin-right:8px;font-size:12px}
.news-item a{color:var(--text);text-decoration:none}
.news-item a:hover{color:var(--accent2)}
.ai-box{background:linear-gradient(135deg,rgba(63,185,80,.08),transparent);border-left:3px solid var(--accent);padding:14px;border-radius:6px;font-size:13px;line-height:1.8;white-space:pre-wrap;min-height:40px}
button{cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1><span>💊</span>医药板块监测台</h1>
  <a href="index.html">← 返回总览</a>
</div>

<div class="kpi-grid" id="kpi"></div>

<div class="section">
  <h2><span class="dot"></span>板块新闻</h2>
  <div id="news"></div>
</div>

<div class="section">
  <h2><span class="dot" style="background:var(--accent2)"></span>AI 综合分析 · DeepSeek
    <button onclick="regenerateAI()" style="margin-left:12px;padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">重新生成</button>
  </h2>
  <div class="ai-box" id="ai">加载中...</div>
  <p style="font-size:11px;color:var(--muted);margin-top:8px">由 DeepSeek 模型读取当日数据后生成；不构成投资建议。</p>
</div>

<div class="section" style="font-size:12px;color:var(--muted)">
  <strong style="color:var(--text)">数据来源</strong><br>
  沪深300/医药ETF/创新药ETF/恒生医疗：<a href="https://finance.yahoo.com/" target="_blank" style="color:var(--accent2)">Yahoo Finance ↗</a> ·
  10Y美债/汇率：Yahoo Finance ·
  新闻：<a href="https://news.google.com/" target="_blank" style="color:var(--accent2)">Google News ↗</a>
</div>

<script>
const DEEPSEEK_KEY = "sk-238f37694a504056b4178fb33d6613b6";

async function load(){
  try {
    const L = await fetch('data/pharma/latest.json',{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('数据文件未生成，请先去GitHub Actions跑一次workflow');
      return r.json();
    });
  document.getElementById('kpi').innerHTML = [
    {label:'沪深300', value:L.hs300.toFixed(0), chg:L.hs300_chg, src:'Yahoo 000300.SS · '+L.date},
    {label:'医药ETF', value:L.med_etf.toFixed(3), chg:L.med_etf_chg, src:'Yahoo 512010.SS · '+L.date},
    {label:'创新药ETF', value:L.inn_etf.toFixed(3), chg:L.inn_etf_chg, src:'Yahoo 159992.SZ · '+L.date},
    {label:'CXO医疗ETF', value:L.cxo_etf.toFixed(3), chg:L.cxo_etf_chg||0, src:'Yahoo 512170.SS'},
    {label:'中药ETF', value:L.tcm_etf.toFixed(3), chg:L.tcm_etf_chg||0, src:'Yahoo 159647.SZ'},
    {label:'医疗器械ETF', value:L.meddev_etf.toFixed(3), chg:L.meddev_etf_chg||0, src:'Yahoo 159883.SZ'},
    {label:'疫苗ETF', value:L.vaccine_etf.toFixed(3), chg:L.vaccine_etf_chg||0, src:'Yahoo 516160.SS'},
    {label:'恒生医疗', value:L.hsi_health.toFixed(0), chg:L.hsi_health_chg, src:'Yahoo 000012.HK · '+L.date},
    {label:'超额(医药vs300)', value:(L.excess>=0?'+':'')+L.excess.toFixed(2)+'%', chg:L.excess, src:'ETF涨幅-300涨幅'},
    {label:'10Y美债', value:L.tnx.toFixed(2)+'%', chg:0, src:'Yahoo ^TNX · '+L.date},
    {label:'美元/人民币', value:L.usdcny.toFixed(4), chg:0, src:'Yahoo CNY=X · '+L.date},
  ].map(c=>`
    <div class="kpi">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="chg ${c.chg>=0?'up':'down'}">${c.chg!==0?(c.chg>=0?'+':'')+c.chg.toFixed(2)+'%':''}</div>
      <div class="src">${c.src}</div>
    </div>
  `).join('');

  document.getElementById('news').innerHTML = (L.news||[]).map(n=>`
    <div class="news-item"><span class="date">${n.date}</span><a href="${n.url}" target="_blank">${n.text}</a></div>
  `).join('') || '<span style="color:var(--muted)">暂无新闻</span>';

  const aiEl = document.getElementById('ai');
  if(L.ai_analysis) aiEl.textContent = L.ai_analysis;
  else aiEl.innerHTML = '<span style="color:var(--muted)">AI分析未生成'+(L.ai_error?'（'+L.ai_error+'）':'')+'</span>';
}
load().catch(e=>document.body.innerHTML='<p style="color:red">加载失败: '+e+'</p>');

async function regenerateAI(){
  const el = document.getElementById('ai');
  el.textContent = '分析中...';
  try {
    const L = await fetch('data/pharma/latest.json',{cache:'no-store'}).then(r=>r.json());
    const newsLines = (L.news||[]).slice(0,8).map(n=>`  - [${n.date}] ${n.text}`).join('\n');
    const prompt = `请作为医药板块分析师，基于以下数据对今日A股医药行业进行跟踪分析。

【核心数据】
- 沪深300：${L.hs300}（${(L.hs300_chg>=0?'+':'')+L.hs300_chg}%）
- 医药ETF：${L.med_etf}（${(L.med_etf_chg>=0?'+':'')+L.med_etf_chg}%）
- 创新药ETF：${L.inn_etf}（${(L.inn_etf_chg>=0?'+':'')+L.inn_etf_chg}%）
- CXO医疗ETF：${L.cxo_etf||'?'}（${(L.cxo_etf_chg>=0?'+':'')+(L.cxo_etf_chg||0)}%）
- 中药ETF：${L.tcm_etf||'?'}（${(L.tcm_etf_chg>=0?'+':'')+(L.tcm_etf_chg||0)}%）
- 医疗器械ETF：${L.meddev_etf||'?'}（${(L.meddev_etf_chg>=0?'+':'')+(L.meddev_etf_chg||0)}%）
- 疫苗ETF：${L.vaccine_etf||'?'}（${(L.vaccine_etf_chg>=0?'+':'')+(L.vaccine_etf_chg||0)}%）
- 恒生医疗：${L.hsi_health}（${(L.hsi_health_chg>=0?'+':'')+L.hsi_health_chg}%）
- 10Y美债：${L.tnx}%
- 美元/人民币：${L.usdcny}
- 医药相对沪深300超额：${(L.excess>=0?'+':'')+L.excess}%

【当日医药新闻】
${newsLines}

【分析要求】
1. 涨跌归因：今日板块表现是政策驱动、事件催化（license-out/临床数据）、利率驱动还是大盘贝塔？领涨子板块背后的逻辑
2. 结构：子板块之间是否分化，资金在板块内部往哪里切换
3. 联动：港股创新药与A股是否共振，美债利率变动如何影响创新药/CXO估值
4. 政策扫描：集采/医保谈判/支付改革等政策对各子板块的短期情绪与中长期格局影响
5. 情绪：涨跌停家数、新闻热度判断板块情绪位置

【输出格式】
- 一段话行情解读（100字以内，明确主导驱动与子板块结构）
- 短期展望（板块方向 + 需跟踪的催化与风险）
- 当日重要个股/政策事件摘要（1-2条，附事件性质判断：一次性催化还是基本面变化）

如某项数据当日未更新，标注"未更新"并沿用最近值，不要编造数据。用中文，普通人能懂。`;

    const resp = await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+DEEPSEEK_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:'你是严谨的医药行业分析师。'},{role:'user',content:prompt}],temperature:0.3,max_tokens:500})
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message);
    el.textContent = data.choices[0].message.content;
  } catch(e) {
    el.innerHTML = '<span style="color:#f85149">生成失败: '+e.message+'</span>';
  }
}
</script>
</body>
</html>
